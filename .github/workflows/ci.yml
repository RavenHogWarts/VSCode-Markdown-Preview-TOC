name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # 从 package.json 的 packageManager (pnpm@9.15.0) 读取版本，
        # 不要在此再指定 version，否则与 packageManager 冲突报错。
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build (prod)
        run: pnpm run build:prod

      - name: Package
        run: pnpm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-markdown-preview-toc-vsix
          path: '*.vsix'
          if-no-files-found: error
